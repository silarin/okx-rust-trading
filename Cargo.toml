[workspace]
resolver = "2"
members = [
    "crates/okx-trading-runtime",
    "crates/okx-public-protocol",
    "crates/okx-market-model",
]
default-members = [
    "crates/okx-trading-runtime",
    "crates/okx-public-protocol",
    "crates/okx-market-model",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
hmac = "0.13.0"
okx-market-model = { path = "crates/okx-market-model", version = "=0.2.0" }
okx-public-protocol = { path = "crates/okx-public-protocol", version = "=0.2.0" }
pretty_assertions = "1.4.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rust_decimal = "1.42.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.1.2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "env-filter", "fmt", "registry"] }
url = "2.5.7"
zeroize = { version = "1.8.2", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
incremental = false
